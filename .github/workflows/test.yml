# 單元測試（含模糊測試）：獨立於部署，卡住或失敗都不會擋住網站更新
name: Tests

on:
  pull_request:
  push:
    branches: [claude/**]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  # 一次性的 1897 官方卡牌重建：沿用原本的 XML -> parser -> cards.json 流程。
  # 僅限本功能分支，在產生且測試成功後才 commit；絕不推送 main。
  generate_whizbang:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/whizbang-mini-gigantify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whizbang-mini-gigantify
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate official Whizbang cards from HearthSim XML
        run: npm run cards -- --set=1897
      - name: Summarize unsupported official cards
        run: |
          echo "=== Workshop unsupported by existing DSL ==="
          grep -P '^\S+\t1897\t' .cache/unsupported.txt | head -100 || true
          node -e "const j=require('./src/data/cards.json');console.log('Whizbang collectible cards:', j.cards.filter(c=>c.collectible&&c.set===1897).length)"
      - run: npm run build
      - name: Commit generated card database to feature branch
        run: |
          git add src/data/cards.json docs/workshop-source.json docs/workshop-unimplemented.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data(workshop): regenerate supported 1897 cards from official CardDefs"
            git push origin HEAD:feat/whizbang-mini-gigantify
          fi
